name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source code ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Java (required for Android build tools) ─────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Setup Flutter SDK ─────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      # ── 4. Verify Flutter installation ───────────────────────────────────
      - name: Flutter version info
        run: flutter --version

      # ── 5. Fetch dependencies ─────────────────────────────────────────────
      - name: Get dependencies
        run: flutter pub get

      # ── 6. Run analyzer (non-blocking — warns but doesn't fail build) ─────
      - name: Analyze project
        run: flutter analyze --no-fatal-infos || true

      # ── 7. Build release APK ──────────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release --no-shrink

      # ── 8. Rename APK with version + timestamp ────────────────────────────
      - name: Rename APK artifact
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk \
             output/lan_ip_camera_$(date +'%Y%m%d_%H%M').apk

      # ── 9. Upload APK as downloadable artifact ────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan_ip_camera_release_apk
          path: output/*.apk
          retention-days: 30

      # ── 10. Print download info ───────────────────────────────────────────
      - name: Build success summary
        run: |
          echo "✅ APK built successfully!"
          echo "📦 Download from the Actions tab → Artifacts section"
          ls -lh output/
